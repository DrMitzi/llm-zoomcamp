description = "dlt + logfire homework: instrument a Module 1 agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "minsearch>=0.0.11",
    "requests>=2.28.1",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=0.0.30",
    "logfire>=4.37.0",
    "numpy>=2.4.4",
    "onnxruntime>=1.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "tokenizers>=0.23.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.15.0",
    "jupyter>=1.1.1",
]
